<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Minecraft Mod Development Skills">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8b949e" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect width="1280" height="3" fill="url(#accent)"/>

  <g fill="none" stroke="#58a6ff" stroke-width="1.5">
    <polygon points="1070,70 1140,110 1070,150 1000,110" fill="#58a6ff" fill-opacity="0.06" stroke-opacity="0.30"/>
    <polygon points="1000,110 1070,150 1070,230 1000,190" fill="#3fb950" fill-opacity="0.05" stroke-opacity="0.24"/>
    <polygon points="1070,150 1140,110 1140,190 1070,230" fill="#8b949e" fill-opacity="0.05" stroke-opacity="0.24"/>
    <path d="M1000,110 V190 M1140,110 V190 M1000,190 L1070,230 L1140,190 M1070,150 V230" stroke-opacity="0.30"/>
  </g>

  <text x="80" y="88" fill="#58a6ff" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="3.4">SKILLS FOR AI CODING AGENTS</text>

  <text x="80" y="152" fill="#e6edf3" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="700">Minecraft Mod Development Skills</text>

  <text x="80" y="190" fill="#8b949e" font-family="Helvetica, Arial, sans-serif" font-size="15">Documentation and scripts only — no mod source code, no third-party jars, no runtime artifacts.</text>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#c9d1d9">
    <rect x="80" y="232" width="112" height="30" rx="6" fill="#1f2937" fill-opacity="0.55" stroke="#30363d"/>
    <text x="136" y="251" text-anchor="middle">Forge 1.20.1</text>
    <rect x="200" y="232" width="134" height="30" rx="6" fill="#1f2937" fill-opacity="0.55" stroke="#30363d"/>
    <text x="267" y="251" text-anchor="middle">NeoForge 1.21.1</text>
    <rect x="342" y="232" width="122" height="30" rx="6" fill="#1f2937" fill-opacity="0.55" stroke="#30363d"/>
    <text x="403" y="251" text-anchor="middle">Fabric 1.21.1</text>
    <rect x="472" y="232" width="72" height="30" rx="6" fill="#1f2937" fill-opacity="0.55" stroke="#30363d"/>
    <text x="508" y="251" text-anchor="middle">Paper</text>
    <rect x="552" y="232" width="100" height="30" rx="6" fill="#1f2937" fill-opacity="0.55" stroke="#30363d"/>
    <text x="602" y="251" text-anchor="middle">Datapacks</text>
    <rect x="660" y="232" width="110" height="30" rx="6" fill="#1f2937" fill-opacity="0.55" stroke="#30363d"/>
    <text x="715" y="251" text-anchor="middle">Shaderpacks</text>
  </g>

  <text x="80" y="302" fill="#6e7681" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">github.com/1145AS780/minecraft-mod-skills</text>
</svg>